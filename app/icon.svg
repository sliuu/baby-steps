<svg xmlns="http://www.w3.org/2000/svg" viewBox="34 34 212 212">
  <!-- The Today flower, every petal full, in the category inks. Colours live in the style block (see lib/icon-svg.test.ts). -->
  <style>
    :root {
      --oxblood: #7A1F1F;
      --bottle: #23402F;
      --mustard: #C9A23A;
      --rose: #D98C7A;
      --sage: #8FA98A;
      --plum: #765B8C;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --oxblood: #7A1F1F;
        --bottle: #8FB79C;
        --mustard: #C9A23A;
        --rose: #D98C7A;
        --sage: #8FA98A;
        --plum: #765B8C;
      }
    }
    .oxblood { fill: var(--oxblood); }
    .bottle { fill: var(--bottle); }
    .mustard { fill: var(--mustard); }
    .rose { fill: var(--rose); }
    .sage { fill: var(--sage); }
    .plum { fill: var(--plum); }
  </style>
  <defs>
    <path id="p" d="M 0 0 C 0.28 -0.2 0.28 -1 0 -1 C -0.28 -1 -0.28 -0.2 0 0 Z"/>
  </defs>
  <g transform="translate(140 140)">
    <use href="#p" transform="rotate(0) translate(0 -6) scale(98)" class="oxblood"/>
    <use href="#p" transform="rotate(60) translate(0 -6) scale(98)" class="bottle"/>
    <use href="#p" transform="rotate(120) translate(0 -6) scale(98)" class="mustard"/>
    <use href="#p" transform="rotate(180) translate(0 -6) scale(98)" class="rose"/>
    <use href="#p" transform="rotate(240) translate(0 -6) scale(98)" class="sage"/>
    <use href="#p" transform="rotate(300) translate(0 -6) scale(98)" class="plum"/>
    <circle r="4.5" class="bottle"/>
  </g>
</svg>
